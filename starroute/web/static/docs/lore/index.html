<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lore · Jumpgate Starroute</title>
<link rel="stylesheet" href="../_style.css"/>
<link rel="stylesheet" href="../../css/help.css"/>
<link rel="stylesheet" href="lore.css"/>
</head>
<body class="lore-app">
<header>
  <strong>Jumpgate Starroute</strong>
  <nav data-site-nav aria-label="Site" style="margin-top:0.55rem"></nav>
</header>
<main class="lore-shell">
  <div class="lore-toolbar">
    <label data-help="lorePackSelect">
      Map pack
      <select id="lore-pack"></select>
    </label>
    <p id="lore-pack-note" class="note"></p>
  </div>
  <div class="lore-layout">
    <aside class="lore-sidebar" data-help="loreSidebar">
      <h2>Pages</h2>
      <label class="note" for="lore-search">Search titles</label>
      <input id="lore-search" type="search" placeholder="Overview, cultures…" autocomplete="off"/>
      <ul id="lore-list"></ul>
      <div class="lore-side-actions">
        <button id="btn-lore-new" class="btn" type="button" data-help="loreEditor">Add a page</button>
        <button id="btn-lore-edit" class="btn" type="button" data-help="loreEditor">Edit page</button>
        <label class="btn file-btn" data-help="loreLoad">Load files
          <input id="lore-import" type="file" accept=".md,.markdown,.json,text/markdown,application/json" multiple />
        </label>
        <button id="btn-lore-export" class="btn" type="button" data-help="loreLoad">Export yours</button>
      </div>
      <p class="note tiny">Shipped pages stay in <code>setting/</code>. Your pages live in this browser (and optionally <code>setting/custom/</code> in the repo).</p>
    </aside>
    <div class="lore-main">
      <article id="lore-article" class="lore-article" data-help="loreArticle">
        <p class="lore-status">Loading pages…</p>
      </article>
      <p id="lore-status" class="lore-status"></p>
    </div>
  </div>
</main>

<div id="lore-editor" class="lore-editor hidden" role="dialog" aria-labelledby="lore-editor-title">
  <div class="lore-editor-panel">
    <header>
      <h2 id="lore-editor-title">Edit page</h2>
      <button id="lore-editor-close" class="btn" type="button">Close</button>
    </header>
    <p id="lore-editor-note" class="note"></p>
    <label>Title
      <input id="lore-editor-title-input" type="text" autocomplete="off" />
    </label>
    <div class="lore-editor-split">
      <label class="lore-editor-md">Markdown
        <textarea id="lore-editor-md" spellcheck="true"></textarea>
      </label>
      <div>
        <p class="note">Preview</p>
        <div id="lore-editor-preview" class="lore-article"></div>
      </div>
    </div>
    <div class="lore-editor-actions">
      <button id="lore-editor-save" class="btn primary" type="button">Save to this browser</button>
      <button id="lore-editor-delete" class="btn danger" type="button">Delete your copy</button>
    </div>
  </div>
</div>

<script src="../../js/site-nav.js"></script>
<script src="../../js/glossary.js"></script>
<script src="../../js/help.js"></script>
<script src="index.js"></script>
<script src="marked.min.js"></script>
<script src="lore.js"></script>
</body>
</html>
