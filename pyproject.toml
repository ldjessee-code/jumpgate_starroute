[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptah"
version = "3.0.0"
description = "Jumpgate Starroute (Ptah) — interstellar map, jump network, Worldstack L0–L2/L11"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scipy>=1.11.4",
  "networkx>=3.2.1",
  "fastapi>=0.115.0",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ptah = "starroute.web.app:main"
starroute = "starroute.__main__:main"

[tool.setuptools.packages.find]
include = ["starroute*"]

[tool.setuptools.package-data]
starroute = ["web/static/**/*", "web/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
